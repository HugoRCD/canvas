shamefullyHoist: true
ignoreWorkspaceRootCheck: true

overrides:
  '@nuxtjs/mdc': ^0.23.3

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  vue-demi: false
  better-sqlite3: true
  sharp: true
  unrs-resolver: false

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  # Nuxt
  - '@nuxt/*'
  - '@nuxtjs/*'
  - 'nuxt'
  - 'nuxt-*'
  # Vercel
  - '@vercel/*'
  - '@ai-sdk/*'
  - 'ai'
